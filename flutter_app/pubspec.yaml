name: smartgrade
description: Arabic SmartGrade Android application with encrypted offline workspace.
publish_to: none
version: 1.1.0+2
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  file_picker: ^13.4.0
  uuid: ^4.6.0
  path_provider: ^2.1.5
  cryptography: ^2.7.0
  excel: ^4.0.6
  pdf: ^3.11.3
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
