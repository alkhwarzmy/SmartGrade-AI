name: Verify release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Diagnose reference cases and actual printed Arabic OCR without paid requests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m scripts.diagnose_grading --ocr-sample --output /tmp/smartgrade-grading-diagnostic.json
          python - <<'PY'
          import json
          report = json.load(open("/tmp/smartgrade-grading-diagnostic.json"))
          assert report["ocr"]["tested"] and report["external_calls"] == 0
          assert not report["model_evaluated"]
          assert len(report["reference_contracts"]) == 6
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grading-diagnostic-evidence
          path: /tmp/smartgrade-grading-diagnostic.json
      - name: Generate current embedded sources
        run: |
          python -m scripts.build_colab_notebook
          python -m scripts.build_institution_notebook
          python -m scripts.build_complete_notebook
      - run: python -m ruff check .
      - name: Validate direct Colab launcher
        run: python -m unittest -v test_colab_direct
      - run: python -m pytest -q
        env:
          ALLOW_EXTERNAL_AI: 'false'
          ALLOW_PAID_API: 'false'
      - run: python -m scripts.validate_colab_notebook --execute-smoke
      - run: python -m scripts.validate_colab_notebook --notebook notebooks/SmartGrade_Institution_Colab.ipynb
      - run: python -m scripts.validate_colab_notebook --notebook notebooks/SmartGrade_Complete_Colab.ipynb
      - run: python -m pip install pip-audit cyclonedx-bom
      - run: pip-audit --no-deps --disable-pip -r requirements-runtime.lock --format json --output python-audit.json
      - run: cyclonedx-py requirements requirements-runtime.lock --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-security-evidence
          path: |
            python-audit.json
            sbom.cdx.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t smartgrade:1.0.0-rc2 .
      - run: docker run --rm --read-only --tmpfs /tmp -e SMARTGRADE_DATA_DIR=/tmp/smartgrade --cap-drop ALL --security-opt no-new-privileges --entrypoint python smartgrade:1.0.0-rc2 -c "import os; assert os.getuid()==10001; from api import app; assert app"
      - run: |
          mkdir -p security-results
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/security-results:/results" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --scanners vuln --format json --output /results/image-audit.json smartgrade:1.0.0-rc2
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed smartgrade:1.0.0-rc2 > security-results/gate.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-security-evidence
          path: security-results/

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python scripts/prepare_flutter_android.py
      - name: Resolve and format Flutter
        working-directory: flutter_app
        run: |
          flutter pub get
          dart fix --apply
          dart format lib test tool integration_test
      - name: Analyze and test native client
        working-directory: flutter_app
        run: |
          flutter analyze
          flutter test
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Real Dart client and disposable API integration
        run: python -m scripts.flutter_api_smoke
      - name: Build APK for internal Android device testing
        working-directory: flutter_app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Android-test-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
      - name: Archive Android sources
        run: |
          python - <<'PY'
          from scripts.build_colab_notebook import source_files, ROOT
          import zipfile
          with zipfile.ZipFile("flutter-source.zip", "w", zipfile.ZIP_DEFLATED) as out:
              for path in source_files():
                  name = path.relative_to(ROOT).as_posix()
                  if name.startswith("flutter_app/"):
                      out.write(path, name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Android-source
          path: flutter-source.zip

  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_AVD_HOME: ${{ runner.temp }}/smartgrade-avd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Prepare independent synthetic native fixtures
        run: python -m scripts.build_offline_fixtures
      - name: Resolve and analyze integration tests
        working-directory: flutter_app
        run: |
          flutter pub get
          dart fix --apply
          dart format lib test integration_test
          flutter analyze
      - name: Configure Android SDK command paths
        run: |
          test -d "$ANDROID_HOME/cmdline-tools/latest/bin"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Install Android emulator system image
        timeout-minutes: 8
        run: sdkmanager "system-images;android-35;google_apis;x86_64" "platform-tools" "emulator"
      - name: Start Android emulator
        run: |
          sudo chmod a+rw /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name offline --path "$ANDROID_AVD_HOME/offline.avd" --package "system-images;android-35;google_apis;x86_64" --device pixel_6
          test -f "$ANDROID_AVD_HOME/offline.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s/offline.avd\ntarget=android-35\n' "$ANDROID_AVD_HOME" > "$ANDROID_AVD_HOME/offline.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          nohup "$ANDROID_HOME/emulator/emulator" -avd offline -no-window -gpu swiftshader -no-audio -no-boot-anim -no-snapshot -memory 3072 > "$RUNNER_TEMP/emulator.log" 2>&1 &
      - name: Wait for Android boot
        timeout-minutes: 6
        run: |
          if ! timeout 120 adb wait-for-device; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
          for attempt in $(seq 1 80); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then break; fi
            sleep 3
          done
          if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Disable device network
        run: |
          adb shell svc wifi disable
          adb shell svc data disable
          adb shell cmd connectivity airplane-mode enable
      - name: Test actual local Android engines with network disabled
        working-directory: flutter_app
        run: flutter test integration_test/offline_test.dart -d emulator-5554 --reporter expanded
      - name: Collect synthetic native evidence
        if: always()
        run: |
          mkdir -p offline-evidence
          adb exec-out run-as com.alkhwarzmy.smartgrade cat files/offline-evidence.json > offline-evidence/validation.json || true
          adb exec-out run-as com.alkhwarzmy.smartgrade cat files/offline-home.png > offline-evidence/home.png || true
          adb shell dumpsys connectivity > offline-evidence/connectivity.txt || true
          cp "$RUNNER_TEMP/emulator.log" offline-evidence/emulator.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Android-offline-native-evidence
          path: offline-evidence/

  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, container, android, offline]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Android-source
          path: .release-input
      - name: Restore verified Android sources
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile
          with zipfile.ZipFile(".release-input/flutter-source.zip") as archive:
              for entry in archive.infolist():
                  path = PurePosixPath(entry.filename)
                  assert not path.is_absolute() and ".." not in path.parts and path.parts[0] == "flutter_app"
                  dest = Path(entry.filename)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(archive.read(entry))
                  if path.name == "gradlew":
                      dest.chmod(0o755)
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: grading-diagnostic-evidence
          path: .release-input
      - name: Preserve measured grading diagnostics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(".release-input/smartgrade-grading-diagnostic.json").read_text())
          assert report["ocr"]["tested"] and not report["model_evaluated"] and report["external_calls"] == 0
          target = Path("docs/releases/grading_diagnostics/validation.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n")
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Android-offline-native-evidence
          path: .release-input/offline
      - name: Preserve actual Android offline evidence
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          source = Path(".release-input/offline")
          report = json.loads((source / "validation.json").read_text())
          assert report["synthetic_only"] and report["blocked_http_client_attempts"] == 0
          assert "production_default_launch_without_server_or_login" in report["checks"]
          assert "native_bundled_arabic_ocr" in report["checks"]
          target = Path("docs/releases/android_offline")
          target.mkdir(parents=True, exist_ok=True)
          (target / "validation.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n")
          shutil.copyfile(source / "home.png", target / "home.png")
          PY
      - name: Write verification record
        env:
          VERIFIED_HEAD: ${{ github.sha }}
          VERIFIED_RUN: ${{ github.run_id }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          path = Path("docs/releases/complete_colab/verification.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              "tested_source_commit": os.environ["VERIFIED_HEAD"],
              "workflow_run": "https://github.com/alkhwarzmy/SmartGrade-AI/actions/runs/" + os.environ["VERIFIED_RUN"],
              "passed": ["python_tests", "direct_launcher_tests", "extracted_notebook_tests",
                         "notebook_source_validation", "python_dependency_audit", "container_security_gate",
                         "flutter_analysis", "flutter_tests", "dart_real_api_smoke", "android_debug_apk_build",
                         "reference_grading_diagnosis", "printed_arabic_ocr", "android_offline_native_omr_ocr",
                         "android_offline_encrypted_storage_backup_and_default_launch"],
              "limits": ["No live Google Colab account execution", "No physical Android camera test",
                         "No measured Arabic handwriting or essay grading accuracy", "APK is internal debug, not store-signed"]
          }, ensure_ascii=False, indent=2) + "\n")
          PY
      - name: Generate and validate complete notebooks
        run: |
          python -m scripts.build_colab_notebook
          python -m scripts.build_institution_notebook
          python -m scripts.build_complete_notebook
          python -m scripts.validate_colab_notebook
          python -m scripts.validate_colab_notebook --notebook notebooks/SmartGrade_Institution_Colab.ipynb
          python -m scripts.validate_colab_notebook --notebook notebooks/SmartGrade_Complete_Colab.ipynb
      - name: Archive complete source
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.build_colab_notebook import source_bundle
          Path("SmartGrade-Complete-Source.zip").write_bytes(source_bundle())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Complete-Colab-and-source
          path: |
            notebooks/SmartGrade_Complete_Colab.ipynb
            SmartGrade-Complete-Source.zip
            docs/releases/complete_colab/verification.json
      - name: Publish verified sources and notebooks without overwriting a newer head
        env:
          VERIFIED_HEAD: ${{ github.sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$VERIFIED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/assets flutter_app/integration_test flutter_app/lib flutter_app/test flutter_app/tool flutter_app/android flutter_app/pubspec.lock docs/releases/complete_colab/verification.json docs/releases/android_offline docs/releases/grading_diagnostics/validation.json notebooks/SmartGrade_Colab.ipynb notebooks/SmartGrade_Institution_Colab.ipynb notebooks/SmartGrade_Complete_Colab.ipynb
          if ! git diff --cached --quiet; then
            git commit -m "Package verified complete Colab notebooks and Android source"
            git push origin HEAD:main
          fi
