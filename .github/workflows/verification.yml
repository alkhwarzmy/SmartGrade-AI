name: Verify release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Generate current embedded sources
        run: |
          python -m scripts.build_colab_notebook
          python -m scripts.build_institution_notebook
          python -m scripts.build_complete_notebook
      - run: python -m ruff check .
      - name: Validate direct Colab launcher
        run: python -m unittest -v test_colab_direct
      - run: python -m pytest -q
        env:
          ALLOW_EXTERNAL_AI: 'false'
          ALLOW_PAID_API: 'false'
      - run: python -m scripts.validate_colab_notebook --execute-smoke
      - run: python -m scripts.validate_colab_notebook --notebook notebooks/SmartGrade_Institution_Colab.ipynb
      - run: python -m scripts.validate_colab_notebook --notebook notebooks/SmartGrade_Complete_Colab.ipynb
      - run: python -m pip install pip-audit cyclonedx-bom
      - run: pip-audit --no-deps --disable-pip -r requirements-runtime.lock --format json --output python-audit.json
      - run: cyclonedx-py requirements requirements-runtime.lock --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-security-evidence
          path: |
            python-audit.json
            sbom.cdx.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t smartgrade:1.0.0-rc2 .
      - run: docker run --rm --read-only --tmpfs /tmp -e SMARTGRADE_DATA_DIR=/tmp/smartgrade --cap-drop ALL --security-opt no-new-privileges --entrypoint python smartgrade:1.0.0-rc2 -c "import os; assert os.getuid()==10001; from api import app; assert app"
      - run: |
          mkdir -p security-results
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/security-results:/results" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --scanners vuln --format json --output /results/image-audit.json smartgrade:1.0.0-rc2
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed smartgrade:1.0.0-rc2 > security-results/gate.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-security-evidence
          path: security-results/

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python scripts/prepare_flutter_android.py
      - name: Resolve and format Flutter
        working-directory: flutter_app
        run: |
          flutter pub get
          dart fix --apply
          dart format lib test tool
      - name: Analyze and test native client
        working-directory: flutter_app
        run: |
          flutter analyze
          flutter test
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Real Dart client and disposable API integration
        run: python -m scripts.flutter_api_smoke
      - name: Build APK for internal Android device testing
        working-directory: flutter_app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Android-test-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
      - name: Archive Android sources
        run: |
          python - <<'PY'
          from scripts.build_colab_notebook import source_files, ROOT
          import zipfile
          with zipfile.ZipFile("flutter-source.zip", "w", zipfile.ZIP_DEFLATED) as out:
              for path in source_files():
                  name = path.relative_to(ROOT).as_posix()
                  if name.startswith("flutter_app/"):
                      out.write(path, name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Android-source
          path: flutter-source.zip

  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, container, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Android-source
          path: .release-input
      - name: Restore verified Android sources
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile
          with zipfile.ZipFile(".release-input/flutter-source.zip") as archive:
              for entry in archive.infolist():
                  path = PurePosixPath(entry.filename)
                  assert not path.is_absolute() and ".." not in path.parts and path.parts[0] == "flutter_app"
                  dest = Path(entry.filename)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(archive.read(entry))
          PY
      - name: Generate and validate complete notebooks
        run: |
          python -m scripts.build_colab_notebook
          python -m scripts.build_institution_notebook
          python -m scripts.build_complete_notebook
          python -m scripts.validate_colab_notebook
          python -m scripts.validate_colab_notebook --notebook notebooks/SmartGrade_Institution_Colab.ipynb
          python -m scripts.validate_colab_notebook --notebook notebooks/SmartGrade_Complete_Colab.ipynb
      - name: Publish verified sources and notebooks without overwriting a newer head
        env:
          VERIFIED_HEAD: ${{ github.sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$VERIFIED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/lib flutter_app/test flutter_app/tool flutter_app/android flutter_app/pubspec.lock notebooks/SmartGrade_Colab.ipynb notebooks/SmartGrade_Institution_Colab.ipynb notebooks/SmartGrade_Complete_Colab.ipynb
          if ! git diff --cached --quiet; then
            git commit -m "Package verified complete Colab notebooks and Android source"
            git push origin HEAD:main
          fi
