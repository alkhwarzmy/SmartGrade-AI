name: Build Arabic acceptance test pack
on:
  push:
    branches: [testpacks/arabic-acceptance-20261124]
    paths:
      - assets/acceptance_pack/**
      - scripts/build_acceptance_pack.py
      - docs/acceptance_pack/**
      - notebooks/SmartGrade_TestPack_Colab.ipynb
      - .github/workflows/acceptance-pack.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Check generator and notebook
        run: |
          python -m ruff check scripts/build_acceptance_pack.py notebooks/SmartGrade_TestPack_Colab.ipynb
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          nb = json.loads(Path("notebooks/SmartGrade_TestPack_Colab.ipynb").read_text())
          for cell in nb["cells"]:
              if cell["cell_type"] == "code":
                  compile(cell["source"], cell["id"], "exec")
          setup = ast.parse(nb["cells"][1]["source"])
          assignment = next(node for node in setup.body if isinstance(node, ast.Assign)
                            and isinstance(node.targets[0], ast.Name) and node.targets[0].id == "SOURCES")
          sources = json.loads(ast.literal_eval(assignment.value.args[0]))
          for name, text in sources.items():
              assert Path(name).read_text(encoding="utf-8") == text, name
          print("Embedded generator sources match repository; no provider calls.")
          PY
      - name: Build images, print files and verify expected outcomes
        env:
          ALLOW_EXTERNAL_AI: 'false'
          ALLOW_PAID_API: 'false'
        run: python -m scripts.build_acceptance_pack --output /tmp/smartgrade-test-pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Arabic-acceptance-test-pack
          path: /tmp/smartgrade-test-pack/SmartGrade_TestPack_AR_v1.zip
          retention-days: 30
      - name: Publish synthetic files and their validation record
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$EXPECTED_SOURCE"
          python - <<'PY'
          import shutil
          shutil.copytree("/tmp/smartgrade-test-pack", "examples/acceptance_pack/generated", dirs_exist_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/acceptance_pack/generated
          git commit -m "Publish validated synthetic Arabic test pack [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
