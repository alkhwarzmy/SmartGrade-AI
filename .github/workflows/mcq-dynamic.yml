name: Verify MCQ 1 to 50 in the real application
on:
  push:
    branches: [feature/mcq-1-50-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcq-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Validate count boundaries, actual decoding, API and web state
        run: |
          python -m ruff check .
          python -m pytest -q tests/test_mcq.py tests/test_mcq_dynamic.py tests/test_commercial_api.py tests/test_app.py
      - run: python -m pip install 'playwright>=1.50,<2'
      - run: python -m playwright install --with-deps chromium
      - name: Run real commercial browser workflow for fifty questions
        env:
          TESTED_SOURCE: ${{ github.sha }}
          ALLOW_EXTERNAL_AI: 'false'
          ALLOW_PAID_API: 'false'
        run: python -m experiments.mcq_dynamic.run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mcq-1-to-50-evidence
          path: experiments/mcq_dynamic/evidence/
      - name: Record actual synthetic evidence
        if: always()
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$EXPECTED_SOURCE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/mcq_dynamic/evidence
          if ! git diff --cached --quiet; then
            git commit -m "Record MCQ 1 to 50 verification evidence [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
